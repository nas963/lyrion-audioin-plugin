# AudioIn: audioin://live. audioin-tap (Bin/ plugina) daje sirov PCM stereo S24_3LE (little endian)
# sa ulaza; sposobnost R znaci da LMS daje URL ($URL$), ne otvara stream sam.
# FLAC bez gubitaka za plejere koji ga podrzavaju (squeezelite), PCM za ostale.

ain flc * *
	# R
	[audioin-tap] $URL$ | [flac] -cs --totally-silent --compression-level-0 --force-raw-format --endian=little --sign=signed --channels=2 --bps=24 --sample-rate=$SAMPLERATE$ -

ain pcm * *
	# R
	[audioin-tap] $URL$
